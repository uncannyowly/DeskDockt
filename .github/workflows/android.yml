name: Android source build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check runner Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-37.0" && test -d "$ANDROID_HOME/build-tools/37.0.0"
      - run: ./gradlew assembleRelease lint
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-android-apk
          path: android-companion/app/build/outputs/apk/release/app-release-unsigned.apk
